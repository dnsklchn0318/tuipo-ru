[package]
name = "tuipo"
version = "0.4.1"
edition = "2024"
description = "Local Russian and English spellchecking while typing in terminal applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dnsklchn0318/tuipo-ru"
homepage = "https://github.com/dnsklchn0318/tuipo-ru"
readme = "README.md"
keywords = ["spellcheck", "russian", "english", "cli", "text"]
categories = ["command-line-utilities", "text-processing"]
authors = ["ARahim3 <erahim3@gmail.com>", "dnsklchn0318"]
exclude = ["/tuipo_demo*.png", "/tuipo_demo.gif", "/assets/*.png", "/.github", "/CLAUDE.md", "/config.toml", "/RELEASING.md", ".DS_Store", "/artifacts"]

[[bin]]
name = "tuipo"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
portable-pty = "0.9"
signal-hook = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
vte = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Security adaptations are recorded in vendor/README.md.
harper-core = { version = "=2.0.0", default-features = false }
nix = { version = "0.28", default-features = false, features = ["term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spellbook = "0.4.2"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
assert_cmd = "2"
lru = "=0.18.2"

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
harper-core = { path = "vendor/harper-core" }
harper-pos-utils = { path = "vendor/harper-pos-utils" }
